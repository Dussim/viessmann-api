{
  "clone": [
    {
      "name": "clone",
      "image": "codefloe.com/crow-plugins/clone",
      "settings": {
        "partial": true,
        "depth": 1,
        "lfs": false,
        "recursive": false
      }
    }
  ],
  "steps": [
    {
      "name": "jvmTest",
      "image": "dussim/build-env:jdk26_gradle-9.7.1",
      "environment": {
        "CI": "true",
        "OPEN_API_PATH": "/mnt/viessmann-api/openApi",
        "BUILD_CACHE_USER": {
          "from_secret": "BUILD_CACHE_USER"
        },
        "BUILD_CACHE_USER_PASSWORD": {
          "from_secret": "BUILD_CACHE_USER_PASSWORD"
        },
        "REPO_PASSWORD": {
          "from_secret": "REPO_PASSWORD"
        },
        "REPO_USERNAME": {
          "from_secret": "REPO_USERNAME"
        }
      },
      "commands": [
        "gradle jvmTest --scan",
        "gradle jmh"
      ],
      "when": {
        "event": "push"
      }
    }
  ]
}
