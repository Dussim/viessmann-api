[versions]
ksp = "2.3.11"
testBalloon = "1.0.1-K2.4.0"
kotlin = "2.4.10"
ktlint = "1.8.0"
slf4j = "2.0.18"

[libraries]
# KSP and code generation
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
auto-service-annotations = "com.google.auto.service:auto-service-annotations:1.1.1"
kotlinpoet-ksp = "com.squareup:kotlinpoet-ksp:2.3.0"
auto-service-ksp = "dev.zacsweers.autoservice:auto-service-ksp:1.2.0"
ktlint-rule-engine = { module = "com.pinterest.ktlint:ktlint-rule-engine", version.ref = "ktlint" }
ktlint-ruleset-standard = { module = "com.pinterest.ktlint:ktlint-ruleset-standard", version.ref = "ktlint" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# Kotest
kotest-assertions-core = "io.kotest:kotest-assertions-core:6.2.4"

# TestBalloon
testBalloon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testBalloon" }
testBalloon-integration-kotest-assertions = { module = "de.infix.testBalloon:testBalloon-integration-kotest-assertions", version.ref = "testBalloon" }
junit-platform-launcher = "org.junit.platform:junit-platform-launcher:6.1.3"

# Kotlin
kotlinx-coroutines-core = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0"
swagger-parser = "io.swagger.parser.v3:swagger-parser:2.1.42"

[plugins]
ben-manes-versions = { id = "com.github.ben-manes.versions", version = "0.61.0" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
testBalloon = { id = "de.infix.testBalloon", version.ref = "testBalloon" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version = "5.3.0" }

