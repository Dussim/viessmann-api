# Kotlin
kotlin.code.style=official
ksp.useKSP2=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Gradle
org.gradle.jvmargs=-Xmx1536m -Xms1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+UseCompactObjectHeaders -XX:+UnlockExperimentalVMOptions -XX:+TrustFinalNonStaticFields
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.max-problems=2000

# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true